name: SDK

on:
  push:
    paths:
      - ".github/workflows/sdk.yml"
      - "buf.gen.yaml"
      - "buf.lock"
      - "buf.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "proto/**"
      - "scripts/format-generated-sdks.mjs"
      - "sdk/**"
  pull_request:
    paths:
      - ".github/workflows/sdk.yml"
      - "buf.gen.yaml"
      - "buf.lock"
      - "buf.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "proto/**"
      - "scripts/format-generated-sdks.mjs"
      - "sdk/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate SDK bindings
        run: pnpm sdk:generate
      - name: Verify generated bindings
        run: git diff --exit-code -- sdk/typescript/src/generated sdk/python/src/soulfire
      - name: Lint Protobuf definitions
        run: pnpm sdk:lint-proto
      - name: Check TypeScript SDK
        run: pnpm --filter @soulfiremc/sdk check
      - name: Install Python SDK dependencies
        run: python -m pip install --disable-pip-version-check -e 'sdk/python[dev]'
      - name: Check Python SDK
        run: |
          python -m ruff check sdk/python
          python -m ruff format --check sdk/python
          python -m pytest sdk/python
      - name: Build Python SDK
        working-directory: sdk/python
        run: python -m hatchling build
